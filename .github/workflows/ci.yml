name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
    
    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 flake8-black flake8-isort flake8-bandit flake8-bugbear flake8-comprehensions mypy
    
    - name: Run Black (code formatting check)
      run: |
        black --check --diff simulations/ ai/ tests/ hardware/ experiments/ cad/ examples/
    
    - name: Run Flake8 (linting)
      run: |
        flake8 simulations/ ai/ tests/ hardware/ experiments/ cad/ examples/ --max-line-length=100 --extend-ignore=E203,W503
    
    - name: Run MyPy (type checking)
      run: |
        mypy simulations/ ai/ hardware/ experiments/ cad/ --ignore-missing-imports
      continue-on-error: true  # Type checking is advisory for now

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/Library/Caches/pip
          ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
    
    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry
    
    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create true
        poetry config virtualenvs.in-project true
    
    - name: Cache Poetry virtualenv
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-${{ matrix.python-version }}-
    
    - name: Install dependencies
      run: |
        poetry install --with dev
    
    - name: Run all tests with coverage
      run: |
        poetry run pytest tests/ -v --cov=simulations --cov=ai --cov=hardware --cov=experiments --cov=cad --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
    
    - name: Run unit tests
      run: |
        poetry run pytest tests/unit_tests.py -v --tb=short
    
    - name: 🆕 Verify MADA convergence tests exist
      run: |
        poetry run pytest tests/unit_tests.py::TestMADAConvergence -v --tb=short
    
    - name: 🆕 Verify configuration error detection tests
      run: |
        poetry run pytest tests/unit_tests.py::TestMADAConfigurationErrors -v --tb=short

  integration-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
    
    - name: Run integration tests
      run: |
        poetry run pytest tests/integration_tests.py -v --tb=short
    
    - name: 🆕 Test MADA convergence integration
      run: |
        poetry run pytest tests/integration_tests.py::TestFullSystemIntegration -v --tb=short

  # 🆕 NEW JOB: MADA Convergence Validation
  test-mada-convergence:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
    
    - name: Test convergence quality calculation
      run: |
        poetry run python -c "
        from simulations.equations import calculate_convergence_quality, CONVERGENCE_OPTIMAL
        import numpy as np
        
        # Test correct configuration (opposing)
        B1 = np.array([-50.0, 0.0, 0.0])
        B2 = np.array([50.0, 0.0, 0.0])
        quality = calculate_convergence_quality(B1, B2)
        assert quality > CONVERGENCE_OPTIMAL, f'Expected >0.95, got {quality}'
        print(f'✓ Correct config quality: {quality:.3f}')
        
        # Test wrong configuration (diverging)
        B1_wrong = np.array([50.0, 0.0, 0.0])
        B2_wrong = np.array([-50.0, 0.0, 0.0])
        quality_wrong = calculate_convergence_quality(B1_wrong, B2_wrong)
        assert quality_wrong < -0.9, f'Expected <-0.9, got {quality_wrong}'
        print(f'✓ Wrong config detected: {quality:.3f}')
        "
    
    - name: Test convergence validation function
      run: |
        poetry run python -c "
        from simulations.equations import validate_mada_convergence
        import numpy as np
        
        # Test validation passes for correct config
        B1 = np.array([-50.0, 0.0, 0.0])
        B2 = np.array([50.0, 0.0, 0.0])
        result = validate_mada_convergence(B1, B2)
        assert result['is_valid'], f'Should pass: {result[\"message\"]}'
        assert result['status'] in ['optimal', 'acceptable'], f'Bad status: {result[\"status\"]}'
        print(f'✓ Validation passed: {result[\"status\"]}')
        
        # Test validation fails for wrong config
        B1_wrong = np.array([50.0, 0.0, 0.0])
        B2_wrong = np.array([-50.0, 0.0, 0.0])
        result_wrong = validate_mada_convergence(B1_wrong, B2_wrong)
        assert not result_wrong['is_valid'], 'Should fail for diverging fields'
        assert result_wrong['status'] == 'diverging', f'Expected diverging, got {result_wrong[\"status\"]}'
        print(f'✓ Validation correctly failed: {result_wrong[\"status\"]}')
        "
    
    - name: Run all MADA convergence unit tests
      run: |
        poetry run pytest tests/unit_tests.py::TestMADAConvergence -v
    
    - name: Run MADA configuration error tests
      run: |
        poetry run pytest tests/unit_tests.py::TestMADAConfigurationErrors::test_fcstd_rotation_error -v
    
    - name: Verify FreeCAD bug detection test exists
      run: |
        poetry run pytest tests/unit_tests.py::TestMADAConfigurationErrors::test_fcstd_rotation_error --collect-only

  test-equations:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
    
    - name: Test equations module
      run: |
        poetry run pytest tests/test_equations.py -v --tb=short
    
    - name: Verify symbolic math
      run: |
        poetry run python -c "from simulations.equations import symbolic_surface_field; print(symbolic_surface_field())"
    
    - name: 🆕 Test opposing_field warns about validation
      run: |
        poetry run python -c "
        from simulations.equations import opposing_field
        import inspect
        
        # Check that docstring mentions validation requirement
        doc = inspect.getdoc(opposing_field)
        assert 'NOT verify' in doc or 'validate_mada_convergence' in doc, 'Missing validation warning in docstring'
        print('✓ opposing_field() has validation warning in docstring')
        "
    
    - name: 🆕 Test opposing_field_with_validation exists
      run: |
        poetry run python -c "
        from simulations.equations import opposing_field_with_validation
        import numpy as np
        
        # Test safe function
        B1 = np.array([-50.0, 0.0, 0.0])
        B2 = np.array([50.0, 0.0, 0.0])
        B_opp, info = opposing_field_with_validation(100, 100, 0.6, B1, B2)
        assert info['is_valid'], 'Should validate correct config'
        print(f'✓ opposing_field_with_validation() works: B={B_opp:.2f}T, quality={info[\"quality\"]:.3f}')
        "

  test-thrust-model:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
    
    - name: Test thrust model
      run: |
        poetry run pytest tests/test_thrust_model.py -v --tb=short
    
    - name: Run example simulation
      run: |
        poetry run python simulations/thrust_model.py --b_opposing 50 --frequency 100

  test-navigation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
    
    - name: Test AI navigation
      run: |
        poetry run pytest tests/test_navigation.py -v --tb=short
    
    - name: Verify PyTorch installation
      run: |
        poetry run python -c "import torch; print(f'PyTorch {torch.__version__} installed')"

  # 🆕 NEW JOB: Test Logging with Convergence
  test-logging:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
    
    - name: Test FlightLogger with convergence tracking
      run: |
        poetry run python -c "
        from testing.logging import FlightLogger
        import numpy as np
        
        logger = FlightLogger()
        
        # Log data with MADA field vectors
        logger.log({
            'accel_x': 1.0, 'accel_y': 0.0, 'accel_z': 0.0,
            'B1_x': -50.0, 'B1_y': 0.0, 'B1_z': 0.0,
            'B2_x': 50.0, 'B2_y': 0.0, 'B2_z': 0.0,
            'power': 1000, 'temp': 50
        })
        
        # Verify convergence was calculated
        assert 'mada_convergence_quality' in logger.data.columns, 'Missing convergence column'
        quality = logger.data['mada_convergence_quality'].iloc[0]
        assert quality > 0.95, f'Expected high quality, got {quality}'
        print(f'✓ FlightLogger auto-calculated convergence: {quality:.3f}')
        "
    
    - name: Test convergence analysis in logging
      run: |
        poetry run python -c "
        from testing.logging import FlightLogger
        import tempfile
        import os
        
        # Create temp log with convergence data
        logger = FlightLogger(log_dir=tempfile.mkdtemp())
        for i in range(10):
            logger.log({
                'accel_x': float(i), 'B1_x': -50.0, 'B1_y': 0.0, 'B1_z': 0.0,
                'B2_x': 50.0, 'B2_y': 0.0, 'B2_z': 0.0,
                'power': 1000, 'temp': 50, 'thrust': 100
            })
        
        filepath = logger.save('test_conv.csv')
        
        # Analyze should include convergence stats
        stats = FlightLogger.analyze_data(filepath)
        assert 'mean_convergence_quality' in stats, 'Missing convergence stats'
        print(f'✓ Analysis includes convergence: mean={stats[\"mean_convergence_quality\"]:.3f}')
        
        # Cleanup
        os.remove(filepath)
        "

  # 🆕 NEW JOB: Test Flux Visualizer
  test-flux-visualizer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
    
    - name: Test MADA flux map generation
      run: |
        poetry run python -c "
        from cad.flux_visualizer import generate_dual_mada_flux_map
        import numpy as np
        
        # Test correct configuration
        X, Y, Z, U, V, W, B1, B2, quality = generate_dual_mada_flux_map(
            grid_size=10, converging=True
        )
        assert quality > 0.95, f'Correct config should have quality >0.95, got {quality}'
        print(f'✓ Converging flux map: quality={quality:.3f}')
        
        # Test wrong configuration
        X, Y, Z, U, V, W, B1_w, B2_w, quality_w = generate_dual_mada_flux_map(
            grid_size=10, converging=False
        )
        assert quality_w < -0.9, f'Wrong config should have quality <-0.9, got {quality_w}'
        print(f'✓ Diverging flux map detected: quality={quality_w:.3f}')
        "
    
    - name: Verify visualization functions exist
      run: |
        poetry run python -c "
        from cad.flux_visualizer import (
            generate_dual_mada_flux_map,
            plot_mada_convergence_diagram,
            plot_interactive_mada_comparison
        )
        print('✓ All MADA visualization functions available')
        "

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, unit-tests, integration-tests, test-mada-convergence]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry
    
    - name: Build package
      run: |
        poetry build
    
    - name: Check package
      run: |
        pip install twine
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist-packages
        path: dist/
        retention-days: 7

  check-formatting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Check Python file syntax
      run: |
        python -m py_compile simulations/*.py ai/*.py tests/*.py hardware/*.py experiments/*.py cad/*.py examples/*.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
    
    - name: Run security check with Safety
      run: |
        pip install safety
        safety check --json || true
      continue-on-error: true
    
    - name: Run Bandit security linter
      run: |
        pip install bandit
        bandit -r simulations/ ai/ hardware/ experiments/ cad/ examples/ -f json || true
      continue-on-error: true

  # 🆕 NEW JOB: Convergence Quality Gate
  convergence-quality-gate:
    runs-on: ubuntu-latest
    needs: [test-mada-convergence, test-logging, test-flux-visualizer]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev
    
    - name: Run comprehensive convergence test suite
      run: |
        poetry run pytest tests/ -k "convergence or mada or MADA" -v --tb=short
    
    - name: Verify all critical convergence functions exist
      run: |
        poetry run python -c "
        # Check all critical functions are present
        from simulations.equations import (
            calculate_convergence_quality,
            validate_mada_convergence,
            calculate_field_at_point,
            opposing_field_with_validation,
            CONVERGENCE_OPTIMAL,
            CONVERGENCE_WARNING,
            CONVERGENCE_CRITICAL
        )
        
        from testing.logging import FlightLogger
        from cad.flux_visualizer import (
            generate_dual_mada_flux_map,
            plot_mada_convergence_diagram
        )
        
        print('✓ All critical convergence functions available')
        print(f'  CONVERGENCE_OPTIMAL = {CONVERGENCE_OPTIMAL}')
        print(f'  CONVERGENCE_WARNING = {CONVERGENCE_WARNING}')
        print(f'  CONVERGENCE_CRITICAL = {CONVERGENCE_CRITICAL}')
        "
    
    - name: Generate convergence quality report
      run: |
        poetry run python -c "
        from simulations.equations import calculate_convergence_quality
        import numpy as np
        
        print('=' * 60)
        print('CONVERGENCE QUALITY GATE REPORT')
        print('=' * 60)
        
        test_cases = [
            ('Perfect Opposition', np.array([-1, 0, 0]), np.array([1, 0, 0]), 1.0),
            ('10° Misalignment', np.array([-1, 0, 0]), np.array([0.985, 0.174, 0]), 0.985),
            ('45° Misalignment', np.array([-1, 0, 0]), np.array([0.707, 0.707, 0]), 0.707),
            ('Perpendicular', np.array([1, 0, 0]), np.array([0, 1, 0]), 0.0),
            ('Parallel (Wrong!)', np.array([1, 0, 0]), np.array([1, 0, 0]), -1.0),
            ('Diverging (FreeCAD Bug!)', np.array([1, 0, 0]), np.array([-1, 0, 0]), -1.0)
        ]
        
        all_passed = True
        for name, B1, B2, expected in test_cases:
            quality = calculate_convergence_quality(B1, B2)
            passed = abs(quality - expected) < 0.02
            status = '✓' if passed else '✗'
            print(f'{status} {name:25s} Expected: {expected:6.3f}  Got: {quality:6.3f}')
            if not passed:
                all_passed = False
        
        print('=' * 60)
        if all_passed:
            print('✓ ALL CONVERGENCE TESTS PASSED')
        else:
            print('✗ SOME CONVERGENCE TESTS FAILED')
            exit(1)
        print('=' * 60)
        "
    
    - name: Summary
      if: always()
      run: |
        echo "🎯 Convergence Quality Gate Complete"
        echo ""
        echo "This gate ensures:"
        echo "  ✓ MADA convergence calculation functions exist"
        echo "  ✓ Field direction validation works correctly"
        echo "  ✓ FreeCAD-type configuration errors are detectable"
        echo "  ✓ Logging includes convergence quality tracking"
        echo "  ✓ Visualization tools validate field opposition"
        echo ""
        echo "All pull requests must pass this gate to merge."
